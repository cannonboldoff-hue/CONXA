name: Build Studio

# Builds the Conxa Build Studio Electron app (NSIS installer for Windows).
# Publishes to a private GitHub Release on the stable or beta channel.
# Tags: studio-v1.2.3 → stable, studio-v1.2.3-beta.1 → beta

on:
  push:
    tags:
      - "studio-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. studio-v1.2.0)"
        required: true

jobs:
  # Regression gate — runs the Build Studio's Python + TypeScript quality checks
  # before the (slow, Windows-only) packaging job. Closes the historical gap where
  # CI only packaged the app and never tested it.
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install packages/conxa-core
          python -m pip install -r conxa-builder/python/requirements.txt
          python -m pip install --ignore-installed PyJWT -r conxa-cloud/backend/requirements.txt
          python -m pip install pytest ruff razorpay

      - name: Install Chromium for Playwright tests
        run: python -m playwright install chromium

      - name: Ruff lint (Build Studio Python)
        run: ruff check conxa-builder/python

      - name: Pytest (Build Studio pipeline)
        working-directory: conxa-cloud
        # The five --ignore'd modules have pre-existing, non-refactor failures
        # (environmental runtime-dir shadowing, a legacy data-testid regex, and
        # cloud billing/config tests needing external credentials). Tracked in
        # PHASE_1_REFACTOR_REPORT.md; excluded so this gate stays deterministic.
        run: |
          pytest -q \
            --ignore=tests/test_conxa_runtime.py \
            --ignore=tests/test_element_fingerprint.py \
            --ignore=tests/test_razorpay_routes.py \
            --ignore=tests/test_product_routes.py \
            --ignore=tests/test_llm_proxy_and_publish.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: conxa-builder/electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: conxa-builder/electron
        run: npm ci

      - name: Typecheck renderer
        working-directory: conxa-builder/electron
        run: npm run typecheck

      - name: Lint (ESLint)
        working-directory: conxa-builder/electron
        run: npm run lint

      - name: Bridge unit tests
        working-directory: conxa-builder/electron
        run: npm run test:bridge

  build-studio:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      STUDIO_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # used by electron-builder publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: conxa-builder/electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Install conxa-core from source (non-editable). This pulls its runtime
          # deps — pydantic, pydantic-settings, SQLAlchemy — which PyInstaller must
          # see to bundle them. A plain directory path is used (not a wheel glob):
          # PowerShell does not expand `*` for native executables, so a
          # `conxa_core-*.whl` glob would be passed literally to pip and silently
          # fail. The spec collects conxa_core data files from the source tree, so
          # a built wheel is not needed for package data.
          python -m pip install packages/conxa-core
          python -m pip install -r conxa-builder/python/requirements.txt pyinstaller
        working-directory: .

      - name: Bundle Python backend with PyInstaller
        run: pyinstaller conxa-builder/pyinstaller.spec --noconfirm --distpath conxa-builder/dist
        working-directory: .

      - name: Install Electron dependencies
        working-directory: conxa-builder/electron
        run: npm ci

      - name: Set Studio package version
        working-directory: conxa-builder/electron
        shell: pwsh
        run: |
          $version = "${{ env.STUDIO_VERSION }}" -replace "^studio-v", ""
          npm version $version --no-git-tag-version

      - name: Build renderer
        working-directory: conxa-builder/electron
        run: npm run build:renderer

      - name: Build Studio installer (electron-builder)
        working-directory: conxa-builder/electron
        run: npx electron-builder --config electron-builder.yml --win --publish never
        env:
          GH_TOKEN: ""
          # Code signing (Phase 2.5) — scaffolding, awaiting certificate.
          # Store the base64-encoded .pfx and its password as repo secrets, then
          # uncomment the matching keys in electron-builder.yml (win:). Until the
          # secrets exist these are empty and electron-builder produces an
          # unsigned installer (SmartScreen "Unknown Publisher").
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STUDIO_VERSION }}
          name: Build Studio ${{ env.STUDIO_VERSION }}
          files: |
            conxa-builder/electron/dist/studio/*.exe
            conxa-builder/electron/dist/studio/*.exe.blockmap
            conxa-builder/electron/dist/studio/latest*.yml
          # Dev-lane prereleases (studio-v1.3.0-dev.N / -beta.N / -rc.N) are marked
          # prerelease so the stable auto-updater channel never offers them.
          prerelease: ${{ contains(env.STUDIO_VERSION, '-dev') || contains(env.STUDIO_VERSION, 'beta') || contains(env.STUDIO_VERSION, '-rc') }}
          fail_on_unmatched_files: true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: conxa-build-studio-installer
          path: |
            conxa-builder/electron/dist/studio/*.exe
            conxa-builder/electron/dist/studio/*.exe.blockmap
            conxa-builder/electron/dist/studio/latest*.yml
          retention-days: 30
