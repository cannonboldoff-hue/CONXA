name: Build Runtime App Layer

# Builds the lightweight app layer zip (~60 KB) that ships on every code release.
# Obfuscates JS → zips → uploads to GitHub Release →
# posts the new manifest to the cloud API so the runtime self-updater picks it up.
#
# App layer ships as plain obfuscated JS (NOT V8 bytecode).  Bytecode was dropped
# because @yao-pkg/pkg embeds its own Node build whose V8 differs from official
# nodejs.org Node — same version *string*, different V8 *build* — causing silent
# segfaults when the host exe deserializes bytecode compiled with official Node.
# Obfuscation (self-defending, string-array rc4) still protects the source.
#
# Tag format: app-v<semver>  (e.g. app-v1.2.0)
#
# macOS (Phase 2.4): the app layer is platform-neutral obfuscated JS — the same
# zip loads on the macOS host once it exists — so no separate macOS app job is
# needed here. The macOS work lives in build-runtime-host.yml (host binary +
# keytar.node + notarization), which is the OS-specific piece.

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. app-v1.2.0)"
        required: true

jobs:
  build-conxa-app:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create GitHub Releases

    env:
      APP_VERSION: ${{ inputs.tag || github.ref_name }}
      # Node version for the build environment — used for obfuscation tooling and
      # npm ci. No longer load-bearing for V8 bytecode compatibility; any 24.x works.
      NODE_VERSION: "24"
      # The oldest host exe this app layer is promised to run on. Stamped into
      # version.json, where the runtime's bootstrap enforces it before loading — hosts
      # below it skip the new app layer and self-update the host first. The execution
      # gate below replays against exactly this version, so a wrong value fails the
      # build rather than shipping a false compatibility claim.
      #
      # host-v2.0.0 (2026-07-30) is the oldest host that can run the current app layer:
      #   - versioned component layout (conxa-app/<version>/ + `current` junction,
      #     runtime/version_manager.js) — hosts before host-v1.2.0 look for a flat
      #     conxa-app/server.js and abort with "no app layer found";
      #   - jsonc-parser in _pkg_stubs.js (added 2026-07-21), which the app layer's
      #     config_edit.js reaches through __hostRequire for MCP host registration —
      #     first shipped in a host release with host-v2.0.0.
        # Verified by running runtime/test/e2e/gate_replay.js against both: host-v1.1.2 fails
      # to load the app layer at all, host-v2.0.0 replays to "Done." (2026-08-04).
      MIN_HOST:    "host-v2.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve prerelease flag
        # Prerelease tags (app-v1.3.0-dev.1 / -beta.N / -rc.N) mark the GitHub
        # Release as a prerelease. There is no hosted dev cloud/channel to publish
        # to (removed in 91eebe8) — every build now publishes straight to stable.
        shell: pwsh
        run: |
          $v = "$env:APP_VERSION"
          $pre = if ($v -match '-(dev|beta|rc|alpha)') { "true" } else { "false" }
          Write-Output "IS_PRERELEASE=$pre" | Out-File -Append $env:GITHUB_ENV
          Write-Output "prerelease=$pre"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: runtime/package-lock.json

      - name: Install runtime dependencies
        working-directory: runtime
        run: npm ci

      - name: Guard — app-layer manifest covers every module and require
        # app-layer-files.json is the single source of truth for what ships in
        # the zip (shared with scripts/build-app-local.ps1 so dev and prod can
        # never drift). Machine-checks that it lists every runtime/app/*.js AND
        # that every relative require in a listed file is itself listed — the
        # exact failure shape of the sync_errors.js and run.js-seam gaps.
        working-directory: runtime
        run: node check_app_layer_files.js

      - name: Guard — recovery.js stays zero-network (Tier 1/2 = zero LLM tokens)
        # Machine-checks the invariant that nothing reachable from the Tier 1/2
        # cascade can perform network I/O. LLM fires at Tier 3+ only.
        working-directory: runtime
        run: node app/check_recovery_purity.js

      - name: Guard — every .evaluate()/.count() routes through the page_eval.js deadline seam
        # EXEC-34: a bare .evaluate()/.count() has no timeout of its own and can hang past the
        # run's own EXECUTION_DEADLINE_MS watchdog. Machine-checks that every such call in
        # runtime/app/ goes through page_eval.js's evalOn/countOn instead.
        working-directory: runtime
        run: node app/check_page_eval_seam.js

      - name: Install obfuscation tools
        run: npm install -g javascript-obfuscator

      - name: Obfuscate app JS files
        # File list + per-file obfuscation profile come from app-layer-files.json
        # (see its $comment for why bootstrap.js is absent and why two files need
        # reduced protection). build-app-local.ps1 consumes the same JSON, so the
        # local dev build runs the exact same pipeline as this one.
        #
        # App layer ships as plain obfuscated JS (NOT V8 bytecode) — see the
        # header comment at the top of this workflow for the segfault history.
        working-directory: runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path obfuscated
          $manifest = Get-Content app-layer-files.json -Raw | ConvertFrom-Json
          foreach ($entry in $manifest.files) {
            $f = $entry.name
            $obArgs = @("app/$f", "--output", "obfuscated/$f",
              "--compact", "true",
              "--identifier-names-generator", "mangled",
              "--string-array-rotate", "true",
              "--string-array-shuffle", "true",
              "--dead-code-injection", "false",
              "--debug-protection", "false")
            switch ($entry.profile) {
              "no-self-defending" {
                # process.dlopen / native-module patterns are incompatible with
                # --self-defending (auth_manager.js).
                $obArgs += @("--self-defending", "false",
                  "--string-array", "true",
                  "--string-array-encoding", "rc4",
                  "--string-array-threshold", "0.75")
              }
              "in-page" {
                # Functions Playwright serializes into the browser page realm —
                # string-array/self-defending break them once re-parsed there
                # (page_scripts.js). Mangled identifiers stay safe.
                $obArgs += @("--self-defending", "false",
                  "--string-array", "false")
              }
              default {
                $obArgs += @("--self-defending", "true",
                  "--string-array", "true",
                  "--string-array-encoding", "rc4",
                  "--string-array-threshold", "0.75")
              }
            }
            javascript-obfuscator @obArgs
            Write-Output "Obfuscated: $f ($($entry.profile))"
          }

      - name: Stage obfuscated JS to dist-app
        # obfuscated/ holds exactly what app-layer-files.json produced — no
        # second hand-maintained list to drift out of sync.
        working-directory: runtime
        run: |
          Remove-Item -Recurse -Force dist-app -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist-app
          Copy-Item obfuscated/*.js dist-app/
          Write-Output "Staged $((Get-ChildItem dist-app/*.js).Count) modules"
        shell: pwsh

      - name: Generate version.json and compute per-file SHA-256
        working-directory: runtime
        run: |
          $hashes = @{}
          Get-ChildItem dist-app/*.js | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $hashes[$_.Name] = $hash
            Write-Output "$($_.Name): $hash"
          }
          $meta = @{
            app_version  = $env:APP_VERSION
            min_host     = $env:MIN_HOST
            built_at     = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            # What this app layer can do beyond the base contract; Build Studio reads it before relying on
            # a Studio-only argument (RT-9's test guard) so an older engine can't silently ignore it.
            capabilities = @("test_guard")
            files        = $hashes
          } | ConvertTo-Json -Depth 5
          $meta | Out-File -Encoding UTF8 dist-app/version.json
          Write-Output "version.json written"
        shell: pwsh

      - name: Install Chromium for execution gate
        # Mirrors build-runtime-host.yml's install step exactly. The earlier version of
        # this gate wrapped the install in actions/cache + `timeout-minutes: 20`; restoring
        # a cached extraction of thousands of chromium files on a Windows runner (with
        # Defender scanning each one) pushed past that 20-minute cliff and failed the build,
        # which is why the gate was disabled on 2026-06-28. The host workflow has run this
        # plain, uncached install on every host release since without trouble — so no cache,
        # and no artificial timeout to trip over.
        working-directory: runtime
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.pw-browsers

      - name: Validate app layer against host exe (execution gate — real replay)
        # Download the MIN_HOST exe and run a real, hermetic skill replay against it with the
        # freshly-staged dist-app/ as the conxa-app layer. This validates the app layer
        # against the *actual* host binary AND exercises the Playwright selector engine
        # end-to-end (navigate + click on a local fixture) — an MCP-initialize-only check
        # would NOT catch a broken selector engine, since every locator returns 0 elements
        # while init still succeeds. A non-"Done." result fails the build before anything is
        # zipped or published.
        #
        # Gating against MIN_HOST (not the newest host) is deliberate: MIN_HOST is the
        # compatibility promise stamped into version.json, so this asserts the oldest host
        # we claim to support can actually run this app layer. A failure here usually means
        # MIN_HOST needs bumping, not that the gate is wrong.
        #
        # NOTE: PLAYWRIGHT_BROWSERS_PATH is intentionally passed here so gate_replay.js
        # inherits it via ...process.env and the host exe's server.js respects it.
        working-directory: runtime
        shell: pwsh
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.pw-browsers
        run: |
          $hostVersion = "$env:MIN_HOST"
          $exe = "$env:TEMP\gate-host.exe"
          Write-Output "Downloading host exe: $hostVersion"
          $exeUrl = "https://github.com/${{ github.repository }}/releases/download/$hostVersion/conxa-runtime.exe"
          Invoke-WebRequest -Uri $exeUrl -OutFile $exe -UseBasicParsing
          Write-Output "Running replay gate (app layer = dist-app) against $hostVersion…"
          node test/e2e/gate_replay.js $exe dist-app
          if ($LASTEXITCODE -ne 0) {
            Write-Error "EXECUTION GATE FAILED: app layer replay did not reach 'Done.' under $hostVersion"
            exit 1
          }
          Write-Output "Execution gate passed: app layer replays cleanly under $hostVersion"

      - name: Zip app layer
        working-directory: runtime
        run: |
          $zipName = "conxa-app-$env:APP_VERSION.zip"
          Compress-Archive -Path dist-app/* -DestinationPath $zipName -Force
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          Write-Output "APP_BUNDLE_ZIP=$zipName"    | Out-File -Append $env:GITHUB_ENV
          Write-Output "APP_BUNDLE_SHA256=$hash"    | Out-File -Append $env:GITHUB_ENV
          Write-Output "${zipName}: $hash"
        shell: pwsh

      - name: Create GitHub Release
        # gh release create/upload directly, with a manual retry around the asset
        # upload — softprops/action-gh-release@v2 retries the "release not yet
        # discoverable by tag" lookup but not the upload call itself, so a transient
        # backend lag there fails the whole step with "Error saving asset". Same
        # fix already applied to build-execute.yml (commit 7f8cbd1); mirrored here.
        shell: pwsh
        run: |
          $tag = "$env:APP_VERSION"
          $notes = @"
          ## App Layer $tag

          Lightweight obfuscated-JS app update (~60 KB).
          Minimum host: $env:MIN_HOST

          SHA-256: $env:APP_BUNDLE_ZIP  $env:APP_BUNDLE_SHA256
          "@

          gh release view $tag *>$null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @($tag, "--title", "App Layer $tag", "--notes", $notes)
            if ($env:IS_PRERELEASE -eq "true") { $createArgs += "--prerelease" }
            gh release create @createArgs
            if ($LASTEXITCODE -ne 0) { Write-Error "gh release create failed"; exit 1 }
          }

          $uploaded = $false
          for ($i = 1; $i -le 3; $i++) {
            gh release upload $tag "runtime/$env:APP_BUNDLE_ZIP" --clobber
            if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
            Write-Warning "gh release upload attempt $i failed, retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          if (-not $uploaded) { Write-Error "gh release upload failed after 3 attempts"; exit 1 }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish conxa_app version to the unified signed manifest
        # Writes into the stable component_versions KV store; the cloud endpoint
        # recomposes and re-signs the stable manifest.json immediately after. No
        # private signing key material touches this runner.
        run: |
          if (-not "$env:CLOUD_API_URL") { Write-Output "CLOUD_API_URL not configured — skipping publish"; exit 0 }
          $body = @{
            version      = "$env:APP_VERSION"
            min_host     = "$env:MIN_HOST"
            released_at  = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            files        = @(
              @{ filename = "conxa-app-$env:APP_VERSION.zip"; url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:APP_VERSION/conxa-app-$env:APP_VERSION.zip"; sha256 = "$env:APP_BUNDLE_SHA256" }
            )
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri "$env:CLOUD_API_URL/api/v1/admin/component-versions/conxa_app" `
            -Method POST -Body $body -ContentType "application/json" `
            -Headers @{ Authorization = "Bearer $env:CLOUD_ADMIN_TOKEN" }
          Write-Output "Manifest posted to stable: app-$env:APP_VERSION"
        shell: pwsh
        env:
          CLOUD_API_URL:     ${{ vars.CLOUD_API_URL }}
          CLOUD_ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}
