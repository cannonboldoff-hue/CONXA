name: Build Runtime Host Layer

# Builds the large host binary (~85 MB) that ships quarterly.
# Contains: Node.js runtime + all bundled npm deps + bootstrap.js entry point.
# Also builds keytar.node which must match the Node ABI in the pkg binary.
#
# Tag format: host-v<semver>  (e.g. host-v1.0.0)

on:
  push:
    tags:
      - "host-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. host-v1.0.0)"
        required: true

jobs:
  build-conxa-runtime:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create GitHub Releases

    env:
      HOST_VERSION: ${{ inputs.tag || github.ref_name }}
      # Exact Node @yao-pkg/pkg embeds for the node24 target. Keep in lockstep with
      # build-runtime-app.yml's NODE_VERSION so app bytecode matches this exe's V8.
      NODE_VERSION: "24.15.0"
      # Job-wide so the Chromium install and every step that can launch a browser
      # (including the "offline" unit suite — test_group_required_apps.js launches
      # a real browser for its no-required-apps case) agree on where it lives.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve prerelease flag
        # Prerelease tags (host-v1.2.0-dev.1 / -beta.N / -rc.N) mark the GitHub
        # Release as a prerelease. There is no hosted dev cloud/channel to publish
        # to (removed in 91eebe8) — every build now publishes straight to stable.
        shell: pwsh
        run: |
          $v = "$env:HOST_VERSION"
          $pre = if ($v -match '-(dev|beta|rc|alpha)') { "true" } else { "false" }
          Write-Output "IS_PRERELEASE=$pre" | Out-File -Append $env:GITHUB_ENV
          Write-Output "prerelease=$pre"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: runtime/package-lock.json

      - name: Install build tools (NASM + VS Build Tools for keytar)
        run: |
          choco install nasm --no-progress -y
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools" --no-progress -y
        shell: pwsh

      - name: Install runtime dependencies
        working-directory: runtime
        run: npm ci

      - name: Guard — package.json deps are all stubbed into the host exe
        # _pkg_stubs.js is what makes pkg bundle the npm deps; a dep missing
        # from it works in dev and breaks only inside the packaged exe.
        working-directory: runtime
        run: node check_pkg_stubs.js

      - name: Guard — host-manifest.json matches bootstrap's require closure
        # Every module reachable from bootstrap.js is frozen into this exe;
        # the manifest makes that membership visible and reviewable (edits to
        # listed files are dormant until the next host-vX.Y.Z release).
        working-directory: runtime
        run: node check_host_manifest.js

      - name: Install Chromium (needed by unit suite and the execution gate)
        # test_group_required_apps.js's no-required-apps case launches a real
        # browser, so this must run before "Unit tests" below, not just before
        # the execution gate further down.
        working-directory: runtime
        run: npx playwright install chromium

      - name: Unit tests — offline suite (test/unit/)
        # `npm test` = `node --test test/unit/`: sandboxed (os.tmpdir() + env
        # overrides, no network, never touches the runner's real filesystem
        # state; see the header comment in test_mcp_register.js) but NOT
        # browser-free — test_group_required_apps.js launches a real Chromium.
        # Exe/host-dependent scripts live in test/e2e/ and are run explicitly
        # by their own gate steps below.
        working-directory: runtime
        run: npm test

      - name: Stamp version, host_version, and manifest public key
        working-directory: runtime
        run: |
          # bootstrap.js bakes these fields from package.json into the pkg exe at build
          # time — env vars are NOT readable at runtime from inside the pkg binary.
          #   host_version        → HOST_VERSION constant used for app layer min_host semver gate
          #   version             → global.__runtimeVersion exposed to the disk-resident app layer
          #   ed25519_public_key  → global.__manifestPublicKey, used by manifest_manager.js to
          #                         verify the signed manifest.json's Ed25519 signature. This is a
          #                         long-lived org secret (does not change per release), stored as
          #                         the CONXA_MANIFEST_PUBLIC_KEY repo variable — never the private
          #                         key, which stays server-side as CONXA_MANIFEST_SIGNING_KEY.
          $semver = "$env:HOST_VERSION" -replace '^host-v', ''
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version      = $semver
          $pkg.host_version = "$env:HOST_VERSION"
          if ("$env:MANIFEST_PUBLIC_KEY") { $pkg.ed25519_public_key = "$env:MANIFEST_PUBLIC_KEY" }
          $pkg | ConvertTo-Json -Depth 10 | Out-File -Encoding utf8 package.json
          Write-Output "version stamped:      $semver"
          Write-Output "host_version stamped: $env:HOST_VERSION"
          Write-Output "manifest public key stamped: $(if ($env:MANIFEST_PUBLIC_KEY) { 'yes' } else { 'no (unset)' })"
        shell: pwsh
        env:
          MANIFEST_PUBLIC_KEY: ${{ vars.CONXA_MANIFEST_PUBLIC_KEY }}

      - name: Build conxa-runtime.exe
        working-directory: runtime
        # build:win passes --no-bytecode --public-packages "*" (see runtime/package.json).
        # REQUIRED: pkg's V8 bytecode compilation corrupts Playwright's ~300 KB
        # injectedScriptSource string module, which silently breaks the selector engine —
        # every locator/getByRole/CSS query returns 0 while page.evaluate still works, so
        # all skills fail at the first click. Plain source keeps Playwright functional.
        # Do NOT remove these flags without re-running a real execute_skill replay against
        # the resulting exe (the init-only gate in build-runtime-app.yml will NOT catch it).
        run: npm run build:win

      - name: Execution gate — real skill replay (selector engine must resolve)
        # Drives the freshly-built exe through a hermetic navigate+click skill against a
        # local file:// fixture and asserts it reaches "Done.". This is the check that
        # would have caught the pkg-bytecode regression (selector engine returning 0
        # elements). The app layer defaults to the current runtime/ source.
        working-directory: runtime
        run: node test/e2e/gate_replay.js dist/conxa-runtime.exe

      - name: Golden path — templated address, banner, iframe download, upload, two inputs
        # Gap analysis G1. Runs the real app layer (the same code the exe loads) against a
        # hermetic http fixture (test/fixture-site) with two different inputs and no recompile.
        working-directory: runtime
        run: node test/e2e/golden_path.js

      - name: Stage keytar.node for release
        working-directory: runtime
        run: |
          $src = "node_modules\keytar\build\Release\keytar.node"
          if (-not (Test-Path $src)) {
            Write-Error "keytar.node not found at $src — native build may have failed"
            exit 1
          }
          Copy-Item $src -Destination "keytar.node"
          Write-Output "Staged keytar.node ($((Get-Item keytar.node).Length) bytes)"
        shell: pwsh

      - name: Compute SHA-256 checksums
        working-directory: runtime
        run: |
          $winHash    = (Get-FileHash dist/conxa-runtime.exe -Algorithm SHA256).Hash.ToLower()
          $keytarHash = (Get-FileHash keytar.node               -Algorithm SHA256).Hash.ToLower()
          Write-Output "HOST_WIN_SHA256=$winHash"   | Out-File -Append $env:GITHUB_ENV
          Write-Output "KEYTAR_SHA256=$keytarHash"  | Out-File -Append $env:GITHUB_ENV
          Write-Output "conxa-runtime.exe: $winHash"
          Write-Output "keytar.node:          $keytarHash"
        shell: pwsh

      - name: Create GitHub Release
        # gh release create/upload directly, with a manual retry around the asset
        # upload — softprops/action-gh-release@v2 retries the "release not yet
        # discoverable by tag" lookup but not the upload call itself, so a transient
        # backend lag there fails the whole step with "Error saving asset". Same
        # fix already applied to build-execute.yml (commit 7f8cbd1); mirrored here.
        shell: pwsh
        run: |
          $tag = "$env:HOST_VERSION"
          $notes = @"
          ## Runtime Host $tag

          Large host binary (~85 MB). Ships quarterly or when Node/npm deps change.

          SHA-256 checksums:
          conxa-runtime.exe  $env:HOST_WIN_SHA256
          keytar.node           $env:KEYTAR_SHA256
          "@

          gh release view $tag *>$null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @($tag, "--title", "Runtime Host $tag", "--notes", $notes)
            if ($env:IS_PRERELEASE -eq "true") { $createArgs += "--prerelease" }
            gh release create @createArgs
            if ($LASTEXITCODE -ne 0) { Write-Error "gh release create failed"; exit 1 }
          }

          $uploaded = $false
          for ($i = 1; $i -le 3; $i++) {
            gh release upload $tag runtime/dist/conxa-runtime.exe runtime/keytar.node --clobber
            if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
            Write-Warning "gh release upload attempt $i failed, retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          if (-not $uploaded) { Write-Error "gh release upload failed after 3 attempts"; exit 1 }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish conxa_runtime version to the unified signed manifest
        # Writes into the channel's component_versions KV store; the cloud endpoint
        # recomposes and re-signs that channel's manifest.json immediately after. No
        # private signing key material touches this runner — signing happens cloud-side
        # with CONXA_MANIFEST_SIGNING_KEY, which CI never sees.
        run: |
          if (-not "$env:CLOUD_API_URL") { Write-Output "CLOUD_API_URL not configured — skipping publish"; exit 0 }
          $body = @{
            version      = "$env:HOST_VERSION"
            released_at  = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            files        = @(
              @{ filename = "conxa-runtime.exe"; url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:HOST_VERSION/conxa-runtime.exe"; sha256 = "$env:HOST_WIN_SHA256" }
              @{ filename = "keytar.node";       url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:HOST_VERSION/keytar.node";       sha256 = "$env:KEYTAR_SHA256" }
            )
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri "$env:CLOUD_API_URL/api/v1/admin/component-versions/conxa_runtime" `
            -Method POST -Body $body -ContentType "application/json" `
            -Headers @{ Authorization = "Bearer $env:CLOUD_ADMIN_TOKEN" }
          Write-Output "Manifest posted to stable: $env:HOST_VERSION"
        shell: pwsh
        env:
          CLOUD_API_URL:     ${{ vars.CLOUD_API_URL }}
          CLOUD_ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}

  # ── macOS host layer (Phase 2.4) — scaffolding, disabled ────────────────────
  # Skeleton for producing the macOS host binary + arm64/x64 keytar.node and
  # publishing them to the signed runtime manifest. Kept inert (`if: false`)
  # until the external prerequisites exist:
  #   * an Apple Developer account + Developer ID cert (secrets: APPLE_CSC_LINK,
  #     APPLE_CSC_KEY_PASSWORD) and notarytool creds (APPLE_ID, APPLE_APP_PASSWORD,
  #     APPLE_TEAM_ID),
  #   * a macOS installer format (.pkg/.dmg) — no macOS installer_builder exists yet,
  #   * runtime/host/bootstrap.js + runtime/app/version_manager.js verified on darwin.
  # `runtime/package.json` already exposes `build:mac` (pkg node24-mac-x64).
  build-conxa-runtime-macos:
    if: false
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HOST_VERSION: ${{ inputs.tag || github.ref_name }}
      NODE_VERSION: "24.15.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime deps
        working-directory: runtime
        run: npm ci
      - name: Build macOS host binary
        working-directory: runtime
        run: npm run build:mac   # → dist/conxa-runtime-mac
      # TODO(2.4): stage arm64/x64 keytar.node, codesign + notarize (notarytool),
      # compute SHA-256, upload release asset, and POST the mac entry to the
      # signed runtime manifest (mirror the Windows publish step above).
