<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Primary" style="width: 264px; height: 860px; box-sizing: border-box; background: #1e1e1e; border-right: 1px solid rgba(255,255,255,0.08); color: #e8e6e3; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; flex-shrink: 0">
    <div style="width: 24px; height: 24px; border-radius: 7px; background: #d97757; color: #1a1a1a; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">C</div>
    <div style="display: flex; flex-direction: column; line-height: 1.2; flex: 1">
      <span style="font-size: 14px; font-weight: 600">Conxa</span>
      <span style="font-size: 11px; color: #8e8e8e">Build Studio</span>
    </div>
    <button type="button" aria-label="Collapse sidebar" style="width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; color: #8e8e8e; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px; padding: 4px 8px 10px">
    <a href="Chat.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: {{chatColor}}; background: {{chatBg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat</a>
    <a href="NewWorkflow.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: {{newColor}}; background: {{newBg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>New workflow<span style="margin-left: auto; font-size: 11px; color: #8e8e8e">Ctrl N</span></a>
    <a href="#" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: #a3a3a3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>Publish<span title="2 approved workflows not yet published" style="margin-left: auto; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 6px; border-radius: 9px; background: rgba(255,255,255,0.08); font-size: 11px; color: #e8e6e3; display: flex; align-items: center; justify-content: center">2</span></a>
  </div>

  <div style="padding: 0 12px 10px">
    <label style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: #1a1a1a; color: #8e8e8e; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input aria-label="Search workflows" placeholder="Search workflows" style="flex: 1; min-width: 0; border: none; background: transparent; color: #e8e6e3; font: 13px Inter, sans-serif; outline: none; padding: 0"><span style="font-size: 11px">Ctrl K</span></label>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px">
    <sc-if value="{{hasChats}}" hint-placeholder-val="{{ true }}">
      <button type="button" aria-expanded="{{chatsExpanded}}" onClick="{{toggleChats}}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 6px; border: none; border-radius: 8px; background: transparent; color: #8e8e8e; font: 500 12px Inter, sans-serif; text-align: left; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{chatsRot}}); transition: transform 150ms ease-out"><path d="m6 9 6 6 6-6"/></svg>
        <span style="flex: 1">Chats</span>
        <span title="Conversations with Conxa" style="font-size: 11px">{{chatCount}}</span>
      </button>
      <sc-if value="{{chatsOpen}}" hint-placeholder-val="{{ true }}">
      <sc-for list="{{chats}}" as="c" hint-placeholder-count="5">
        <a href="{{c.href}}" title="{{c.statusText}}" style="display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 4px 10px; border-radius: 8px; text-decoration: none; font-size: 13px; color: {{c.color}}; background: {{c.bg}}">
          <sc-if value="{{c.isChat}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></sc-if>
          <sc-if value="{{c.isWorkflow}}" hint-placeholder-val="{{ true }}"><span style="width: 13px; text-align: center; font-size: 10px; color: {{c.glyphColor}}">{{c.glyph}}</span></sc-if>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.label}}</span><sc-if value="{{c.isWorkflow}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #8e8e8e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.hint}}</span></sc-if></span>
        </a>
      </sc-for>
      </sc-if>
    </sc-if>

    <div style="display: flex; align-items: center; height: 30px; padding: 0 4px 0 0; margin-top: 10px">
      <button type="button" aria-expanded="{{groupsExpanded}}" onClick="{{toggleGroups}}" style="flex: 1; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 6px; border: none; border-radius: 8px; background: transparent; color: #8e8e8e; font: 500 12px Inter, sans-serif; text-align: left; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{groupsRot}}); transition: transform 150ms ease-out"><path d="m6 9 6 6 6-6"/></svg><span style="flex: 1">Groups</span><span style="font-size: 11px">{{groupCount}}</span></button>
      <button type="button" aria-label="Create group" style="width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent; color: #8e8e8e; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="margin: 4px 4px; padding: 14px; border: 1px dashed rgba(255,255,255,0.12); border-radius: 10px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; color: #a3a3a3; line-height: 1.5">Groups hold workflows that share sign-ins — like everything you do in one billing app.</span>
        <button type="button" style="align-self: flex-start; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #e8e6e3; font: 500 13px Inter, sans-serif">Create a group</button>
      </div>
    </sc-if>
    <sc-if value="{{groupsOpen}}" hint-placeholder-val="{{ true }}">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <div style="display: flex; align-items: center; height: 32px; border-radius: 8px; background: {{g.bg}}">
          <button type="button" aria-label="{{g.toggleLabel}}" onClick="{{g.toggle}}" style="width: 26px; height: 32px; border: none; background: transparent; color: #8e8e8e; display: flex; align-items: center; justify-content: center; padding: 0 0 0 4px">
            <sc-if value="{{g.open}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></sc-if>
            <sc-if value="{{g.closed}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></sc-if>
          </button>
          <a href="{{g.href}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 32px; padding-right: 10px; text-decoration: none; font-size: 14px; color: {{g.color}}"><span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.label}}</span><sc-if value="{{g.attention}}" hint-placeholder-val="{{ false }}"><span title="An app needs signing in" style="color: #fbbf24; font-size: 10px">▲</span></sc-if><span style="font-size: 12px; color: #8e8e8e">{{g.count}}</span></a>
        </div>
        <sc-if value="{{g.open}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 1px; margin-left: 17px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.08)">
            <sc-for list="{{g.items}}" as="w" hint-placeholder-count="3">
              <a href="{{w.href}}" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 13px; color: {{w.color}}; background: {{w.bg}}"><span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{w.label}}</span><sc-if value="{{w.hasNote}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #8e8e8e; white-space: nowrap">{{w.note}}</span></sc-if><span title="{{w.statusText}}" style="font-size: 10px; color: {{w.glyphColor}}">{{w.glyph}}</span></a>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
    </sc-if>
  </div>

  <div style="border-top: 1px solid rgba(255,255,255,0.08); padding: 8px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
    <a href="Settings.dc.html" aria-label="Open settings" title="Settings" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: #e8e6e3">
      <div style="width: 26px; height: 26px; border-radius: 13px; background: #2c2c2c; border: 1px solid rgba(255,255,255,0.12); font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center">JD</div>
      <div style="display: flex; flex-direction: column; line-height: 1.3; min-width: 0; flex: 1">
        <span style="font-size: 13px">[Workspace name]</span>
        <span style="font-size: 11px; color: #8e8e8e">37 compile credits · 120 edits</span>
      </div>
      <span title="{{connTitle}}" style="font-size: 10px; color: {{connColor}}">{{connGlyph}}</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["chat","new","group","wf-invoice","wf-ledger","none"],"default":"wf-invoice"},"variant":{"editor":"enum","options":["full","empty"],"default":"full"},"offline":{"editor":"boolean","default":false},"$preview":{"width":264,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { closed: {}, chatsOpen: true, groupsOpen: true };
  }
  renderVals() {
    const active = this.props.active ?? 'wf-invoice';
    const empty = (this.props.variant ?? 'full') === 'empty';
    const offline = this.props.offline === true;
    const on = { color: '#e8e6e3', bg: 'rgba(255,255,255,0.07)' };
    const off = { color: '#a3a3a3', bg: 'transparent' };
    const G = { ok: ['●', '#4ade80'], warn: ['▲', '#fbbf24'], fail: ['✕', '#f87171'], run: ['◐', '#93b4e6'], none: ['○', '#8e8e8e'] };
    const wf = (id, label, st, statusText, href, note) => {
      const a = active === id ? on : off;
      return { label, href, glyph: G[st][0], glyphColor: G[st][1], statusText, color: a.color, bg: a.bg, note: note || '', hasNote: !!note };
    };
    // Every workflow is listed in its group from the moment it's created; unfinished
    // ones carry a short status note so they're easy to spot.
    const raw = [
      { id: 'finance', label: 'Finance Ops', count: 3, href: 'Group.dc.html', attention: false, items: [
        wf('wf-invoice', 'Create invoice', 'warn', 'In progress · needs your answers', 'Clarify.dc.html', 'needs answers'),
        wf('wf-refund', 'Refund an order', 'ok', 'Passed · approved', 'TestPassed.dc.html'),
        wf('wf-ledger', 'Export monthly ledger', 'fail', 'Passed before · latest test failed', 'TestFailed.dc.html'),
      ] },
      { id: 'support', label: 'Customer Support', count: 3, href: 'Group.dc.html', attention: true, items: [
        wf('wf-tickets', 'Close stale tickets', 'warn', 'In progress · sign-in needed', 'Recording.dc.html', 'sign-in'),
        wf('wf-merge', 'Merge duplicate contacts', 'none', 'In progress · not recorded yet', 'Recording.dc.html', 'not recorded'),
        wf('wf-reassign', 'Reassign open tickets', 'ok', 'Passed', '#'),
      ] },
      { id: 'onboard', label: 'Onboarding', count: 3, href: 'Group.dc.html', attention: false, defaultClosed: true, items: [
        wf('wf-c', 'Assign training', 'run', 'In progress · compiling', 'Compiling.dc.html', 'compiling'),
        wf('wf-a', 'Provision a new seat', 'ok', 'Passed', '#'),
        wf('wf-b', 'Send welcome pack', 'ok', 'Passed', '#'),
      ] },
    ];
    const chatItem = (id, label, href) => {
      const a = active === id ? on : off;
      return { isChat: true, isWorkflow: false, label, href, hint: '', glyph: '', glyphColor: '', statusText: 'Chat', color: a.color, bg: a.bg };
    };
    const chats = empty ? [] : [
      chatItem('chat', 'Planning a refund workflow', 'Chat.dc.html'),
      chatItem('chat-2', 'Why do tests need sign-in?', 'Chat.dc.html'),
    ];
    const groups = empty ? [] : raw.map((g) => {
      const isClosed = this.state.closed[g.id] ?? (g.defaultClosed === true);
      const a = active === 'group' && g.id === 'finance' ? on : off;
      return {
        ...g, open: !isClosed, closed: isClosed, color: a.color === '#e8e6e3' ? '#e8e6e3' : '#d4d2cf', bg: a.bg,
        toggleLabel: (isClosed ? 'Expand ' : 'Collapse ') + g.label,
        toggle: () => this.setState({ closed: { ...this.state.closed, [g.id]: !isClosed } }),
      };
    });
    const chat = active === 'chat' ? on : off;
    const nw = active === 'new' ? on : off;
    return {
      chatsOpen: this.state.chatsOpen, groupsOpen: this.state.groupsOpen,
      chatsExpanded: String(this.state.chatsOpen), groupsExpanded: String(this.state.groupsOpen),
      chatsRot: this.state.chatsOpen ? '0deg' : '-90deg', groupsRot: this.state.groupsOpen ? '0deg' : '-90deg',
      toggleChats: () => this.setState({ chatsOpen: !this.state.chatsOpen }),
      toggleGroups: () => this.setState({ groupsOpen: !this.state.groupsOpen }),
      groupCount: groups.length,
      groups, isEmpty: empty, chats, hasChats: chats.length > 0, chatCount: chats.length,
      chatColor: chat.color, chatBg: chat.bg, newColor: nw.color, newBg: nw.bg,
      connGlyph: offline ? '✕' : '●', connColor: offline ? '#f87171' : '#4ade80',
      connTitle: offline ? 'Offline — Conxa Cloud unreachable' : 'Connected to Conxa Cloud',
    };
  }
}
</script>
</body>
</html>
